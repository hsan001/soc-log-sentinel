id: SEC-WIN-001
name: Suspicious PowerShell Obfuscation & Download
description: Detects encoded PowerShell command lines, bypass execution policies, hidden windows, or WebClient memory staging.
severity: Critical
log_type: windows
mitre:
  tactic: Execution
  technique_id: T1059.001
  technique_name: "Command and Scripting Interpreter: PowerShell"
detection:
  type: pattern
  target_field: command_line
  patterns:
    - '(?i)(?:-enc|-encodedcommand|-e)\s+[A-Za-z0-9+/=]{10,}'
    - '(?i)-windowstyle\s+hidden'
    - '(?i)-executionpolicy\s+bypass'
    - '(?i)DownloadString\s*\('
    - '(?i)\b(?:IEX|Invoke-Expression)\b'
    - '(?i)Net\.WebClient'
remediation: Enforce PowerShell Constrained Language Mode, enable Script Block Logging (Event ID 4104), and restrict script execution via AppLocker / WDAC.
