[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-log-sentinel"
version = "2.0.0"
description = "Enterprise SOC log analysis & detection engineering toolkit with Sigma-inspired YAML rules and MITRE ATT&CK alignment."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Mohammad Hassan Jalal", email = "hsanjlallko@gmail.com" }
]
keywords = [
    "cybersecurity",
    "soc",
    "detection-engineering",
    "log-analysis",
    "mitre-attack",
    "siem",
    "incident-response",
    "sigma-rules",
    "threat-detection",
    "blue-team"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]

dependencies = [
    "rich>=13.7.0",
    "ruamel.yaml>=0.18.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[project.scripts]
soc-log-sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
include = ["sentinel*"]
