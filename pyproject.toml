[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-log-sentinel"
version = "1.0.0"
description = "A high-performance security log auditing CLI utility for detecting brute force attacks and OWASP Top 10 web injection signatures."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Mohammad Hassan Jalal", email = "hsanjlallko@gmail.com" }
]
keywords = [
    "cybersecurity",
    "soc",
    "log-analysis",
    "owasp",
    "brute-force",
    "incident-response",
    "mitre-attack",
    "siem",
    "blue-team"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[project.scripts]
soc-log-sentinel = "src.cli:main"
