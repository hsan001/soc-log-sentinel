name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install .

      - name: Execute Pytest Suite
        run: |
          pytest tests/ -v

      - name: Validate Multi-Source Ingestion & Detection CLI
        run: |
          python -m sentinel.cli samples/auth.log samples/access.log samples/windows_security.log --rules rules/ --export json -j ci_report.json
          python -c "import json; data = json.load(open('ci_report.json')); assert data['sentinel_version'] == '2.0.0'; assert data['metadata']['total_alerts'] > 0; print('CI Validation Passed! Alerts:', data['metadata']['total_alerts'])"
