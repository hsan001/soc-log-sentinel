name: SOC Log Sentinel CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-audit:
    name: Test & Security Audit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff bandit
          pip install -e .

      - name: Lint with Ruff
        run: |
          python -m ruff check .

      - name: Security Audit with Bandit
        run: |
          python -m bandit -r sentinel -ll -ii

      - name: Execute Pytest Suite
        run: |
          python -m pytest -v

      - name: Run 25,000-Event Sustained Benchmark
        run: |
          python benchmarks/run_bench.py

      - name: Validate Multi-Source Ingestion & Navigator Export
        run: |
          python -m sentinel.cli samples/auth.log samples/access.log samples/windows_security.log --rules rules/ --navigator ci_navigator.json --export json -j ci_report.json
          python -c "import json; data = json.load(open('ci_report.json')); assert data['sentinel_version'] == '2.0.0'; assert data['metadata']['total_alerts'] > 0; print('CI Validation Passed! Alerts:', data['metadata']['total_alerts'])"
